name: Migrate Checkpoint

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: Short-lived release asset URL
        required: true
        type: string
      asset_name:
        description: Checkpoint filename
        required: true
        type: string
      expected_size:
        description: Original checkpoint size in bytes
        required: true
        type: string

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download, sanitize, and upload
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ASSET_NAME" in
            planning_nuscenes_3s_r50.pth|planning_nuscenes_6s_r50.pth) ;;
            *) exit 2 ;;
          esac
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]]
          curl --fail --location --silent --show-error --retry 2 --max-time 1800 \
            --output "$RUNNER_TEMP/original.pth" "$ASSET_URL"
          test "$(stat -c %s "$RUNNER_TEMP/original.pth")" -eq "$EXPECTED_SIZE"
          python tools/release/sanitize_checkpoint.py \
            "$RUNNER_TEMP/original.pth" "$RUNNER_TEMP/$ASSET_NAME"
          gh release upload v0.1-checkpoints "$RUNNER_TEMP/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY"
